name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy src/advanced_rag src/ragcheck
      - name: Bandit
        run: python -m bandit -q -r src -c pyproject.toml
      - name: Dependency audit
        run: python -m pip_audit
      - name: Tests
        run: pytest
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Retrieval gate
        run: python -m ragcheck ci --current results/experiments/latest.json --baseline results/baseline.json --name hnsw

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test retrieval
        run: npm test
      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t advanced-rag:ci .
