[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-rag"
version = "0.1.0"
description = "Local multi-index RAG pipeline extracted from the original notebook."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Shahil Haque" }]
dependencies = [
    "faiss-cpu>=1.8",
    "langchain-text-splitters>=0.3",
    "numpy>=1.26",
    "pymupdf>=1.24,<2",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
api = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-sdk>=1.27",
    "qdrant-client>=1.12",
    "uvicorn>=0.32",
]
dev = [
    "bandit>=1.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.8",
]
load = ["locust>=2.32"]

[project.scripts]
ragcheck = "ragcheck.cli:main"
rag-api = "advanced_rag.api.app:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["advanced_rag", "ragcheck"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101"]

[tool.setuptools.packages.find]
where = ["src"]
